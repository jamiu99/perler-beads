<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图生成器 - 简化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .step {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .step h2 {
            margin-bottom: 15px;
            color: #666;
            font-size: 18px;
        }

        /* 步骤1: 图片上传 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8ebff;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        #originalPreview {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* 步骤2: 参数设置 */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 500;
            color: #555;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .value-display {
            color: #667eea;
            font-weight: 600;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        /* 步骤3: 转换按钮 */
        .action-button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .action-button:hover {
            background: #5568d3;
        }

        .action-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 步骤4: 预览结果 */
        .result-container {
            display: none;
            margin-top: 20px;
        }

        .result-container.active {
            display: block;
        }

        #beadPreview {
            border: 1px solid #ddd;
            border-radius: 4px;
            image-rendering: pixelated;
            max-width: 100%;
        }

        /* 步骤5: 色系统计 */
        .color-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .color-info {
            flex: 1;
        }

        .color-key {
            font-weight: 600;
            color: #333;
        }

        .color-count {
            color: #666;
            font-size: 14px;
        }

        /* 导出按钮组 */
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 拼豆图生成器 - 简化版</h1>

        <!-- 步骤1: 图片上传和预览 -->
        <div class="step">
            <h2>步骤1: 图片上传和预览</h2>
            <div class="upload-area" id="uploadArea">
                <p>📁 点击或拖放图片到这里</p>
                <p style="color: #999; font-size: 14px; margin-top: 10px;">支持 JPG, PNG 格式</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <div class="preview-container" id="previewContainer">
                <h3 style="margin-bottom: 10px;">原图预览：</h3>
                <img id="originalPreview" alt="原图预览">
                <p style="margin-top: 10px; color: #666;">
                    尺寸: <span id="imageSize">-</span>
                </p>
            </div>
        </div>

        <!-- 步骤2: 参数设置 -->
        <div class="step">
            <h2>步骤2: 图片转化参数设置</h2>

            <div class="controls">
                <!-- 2.1 像素化粒度 -->
                <div class="control-group">
                    <label>
                        像素化粒度（横向格子数）
                        <span class="value-display" id="granularityValue">50</span>
                    </label>
                    <input type="range" id="granularity" min="10" max="150" value="50" step="1">
                    <small style="color: #999;">格子越多越精细，但需要的拼豆越多</small>
                </div>

                <!-- 2.2 双模式选择 -->
                <div class="control-group">
                    <label>像素化模式</label>
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="dominant">
                            主导色模式
                            <small style="display: block; font-size: 12px;">适合卡通/Logo</small>
                        </button>
                        <button class="mode-btn" data-mode="average">
                            平均色模式
                            <small style="display: block; font-size: 12px;">适合真实照片</small>
                        </button>
                    </div>
                </div>

                <!-- 2.3 色号体系选择 -->
                <div class="control-group">
                    <label>色号体系（品牌）</label>
                    <select id="colorSystem">
                        <option value="MARD">MARD</option>
                        <option value="COCO">COCO</option>
                        <option value="漫漫">漫漫</option>
                        <option value="盼盼">盼盼</option>
                        <option value="咪小窝">咪小窝</option>
                    </select>
                    <small style="color: #999;">选择你购买拼豆的品牌</small>
                </div>
            </div>

            <!-- 转换按钮 -->
            <button class="action-button" id="convertBtn" disabled style="margin-top: 20px;">
                开始转换为拼豆图
            </button>

            <div class="loading" id="loading">
                <p>⏳ 正在处理中...</p>
            </div>
        </div>

        <!-- 步骤3: 预览拼豆图 -->
        <div class="step">
            <h2>步骤3: 拼豆图预览</h2>
            <div class="result-container" id="resultContainer">
                <canvas id="beadPreview"></canvas>
                <p style="margin-top: 10px; color: #666;">
                    网格尺寸: <span id="gridSize">-</span> |
                    预计珠子数: <span id="beadCount">-</span>
                </p>
            </div>
            <p id="noResult" style="color: #999;">等待转换...</p>
        </div>

        <!-- 步骤4: 色系统计 -->
        <div class="step">
            <h2>步骤4: 拼豆色系统计</h2>
            <div id="colorStats"></div>
            <p id="noStats" style="color: #999;">等待转换...</p>
        </div>

        <!-- 步骤5: 导出 -->
        <div class="step">
            <h2>步骤5: 导出拼豆图和色系</h2>
            <div class="export-buttons">
                <button class="action-button" id="exportImageBtn" disabled>
                    📥 导出拼豆图（PNG）
                </button>
                <button class="action-button" id="exportStatsBtn" disabled>
                    📊 导出色系统计（PNG）
                </button>
            </div>
        </div>
    </div>


    <!-- 引入主脚本（使用 ES6 模块） -->
    <script type="module" src="/main.js"></script>
</body>
</html>
