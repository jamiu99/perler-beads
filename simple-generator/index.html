<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图生成器 - 简化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .step {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .step h2 {
            margin-bottom: 15px;
            color: #666;
            font-size: 18px;
        }

        /* 步骤1: 图片上传 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8ebff;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        #originalPreview {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* 步骤2: 参数设置 */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 500;
            color: #555;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .value-display {
            color: #667eea;
            font-weight: 600;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        /* 步骤3: 转换按钮 */
        .action-button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .action-button:hover {
            background: #5568d3;
        }

        .action-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 步骤4: 预览结果 */
        .result-container {
            display: none;
            margin-top: 20px;
        }

        .result-container.active {
            display: block;
        }

        #beadPreview {
            border: 1px solid #ddd;
            border-radius: 4px;
            image-rendering: pixelated;
            max-width: 100%;
        }

        /* 步骤5: 色系统计 */
        .color-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .color-info {
            flex: 1;
        }

        .color-key {
            font-weight: 600;
            color: #333;
        }

        .color-count {
            color: #666;
            font-size: 14px;
        }

        /* 导出按钮组 */
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 拼豆图生成器 - 简化版</h1>

        <!-- 步骤1: 图片上传和预览 -->
        <div class="step">
            <h2>步骤1: 图片上传和预览</h2>
            <div class="upload-area" id="uploadArea">
                <p>📁 点击或拖放图片到这里</p>
                <p style="color: #999; font-size: 14px; margin-top: 10px;">支持 JPG, PNG 格式</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <div class="preview-container" id="previewContainer">
                <h3 style="margin-bottom: 10px;">原图预览：</h3>
                <img id="originalPreview" alt="原图预览">
                <p style="margin-top: 10px; color: #666;">
                    尺寸: <span id="imageSize">-</span>
                </p>
            </div>
        </div>

        <!-- 步骤2: 参数设置 -->
        <div class="step">
            <h2>步骤2: 图片转化参数设置</h2>

            <div class="controls">
                <!-- 2.1 像素化粒度 -->
                <div class="control-group">
                    <label>
                        像素化粒度（横向格子数）
                        <span class="value-display" id="granularityValue">50</span>
                    </label>
                    <input type="range" id="granularity" min="10" max="150" value="50" step="1">
                    <small style="color: #999;">格子越多越精细，但需要的拼豆越多</small>
                </div>

                <!-- 2.2 双模式选择 -->
                <div class="control-group">
                    <label>像素化模式</label>
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="dominant">
                            主导色模式
                            <small style="display: block; font-size: 12px;">适合卡通/Logo</small>
                        </button>
                        <button class="mode-btn" data-mode="average">
                            平均色模式
                            <small style="display: block; font-size: 12px;">适合真实照片</small>
                        </button>
                    </div>
                </div>

                <!-- 2.3 色号体系选择 -->
                <div class="control-group">
                    <label>色号体系（品牌）</label>
                    <select id="colorSystem">
                        <option value="MARD">MARD</option>
                        <option value="COCO">COCO</option>
                        <option value="漫漫">漫漫</option>
                        <option value="盼盼">盼盼</option>
                        <option value="咪小窝">咪小窝</option>
                    </select>
                    <small style="color: #999;">选择你购买拼豆的品牌</small>
                </div>
            </div>

            <!-- 转换按钮 -->
            <button class="action-button" id="convertBtn" disabled style="margin-top: 20px;">
                开始转换为拼豆图
            </button>

            <div class="loading" id="loading">
                <p>⏳ 正在处理中...</p>
            </div>
        </div>

        <!-- 步骤3: 预览拼豆图 -->
        <div class="step">
            <h2>步骤3: 拼豆图预览</h2>
            <div class="result-container" id="resultContainer">
                <canvas id="beadPreview"></canvas>
                <p style="margin-top: 10px; color: #666;">
                    网格尺寸: <span id="gridSize">-</span> |
                    预计珠子数: <span id="beadCount">-</span>
                </p>
            </div>
            <p id="noResult" style="color: #999;">等待转换...</p>
        </div>

        <!-- 步骤4: 色系统计 -->
        <div class="step">
            <h2>步骤4: 拼豆色系统计</h2>
            <div id="colorStats"></div>
            <p id="noStats" style="color: #999;">等待转换...</p>
        </div>

        <!-- 步骤5: 导出 -->
        <div class="step">
            <h2>步骤5: 导出拼豆图和色系</h2>
            <div class="export-buttons">
                <button class="action-button" id="exportImageBtn" disabled>
                    📥 导出拼豆图（PNG）
                </button>
                <button class="action-button" id="exportStatsBtn" disabled>
                    📊 导出色系统计（PNG）
                </button>
            </div>
        </div>
    </div>

    <!-- 引入 color-diff 库 -->
    <script src="https://cdn.jsdelivr.net/npm/color-diff@1.4.0/lib/diff.min.js"></script>

    <script>
        // ==================== 全局状态 ====================
        let state = {
            originalImage: null,
            pixelationMode: 'dominant',
            colorSystem: 'MARD',
            gridData: null,
            colorCounts: null
        };

        // ==================== 色板数据 ====================
        // 简化的色板数据（常用50种颜色）
        const COLOR_PALETTE = {
            "#FFFFFF": { "MARD": "H1", "COCO": "H01", "漫漫": "H1", "盼盼": "1", "咪小窝": "1" },
            "#000000": { "MARD": "H12", "COCO": "H12", "漫漫": "H12", "盼盼": "20", "咪小窝": "20" },
            "#FF0000": { "MARD": "D07", "COCO": "J07", "漫漫": "A7", "盼盼": "16", "咪小窝": "16" },
            "#00FF00": { "MARD": "B05", "COCO": "F10", "漫漫": "C4", "盼盼": "39", "咪小窝": "39" },
            "#0000FF": { "MARD": "C08", "COCO": "I08", "漫漫": "D8", "盼盼": "53", "咪小窝": "53" },
            "#FFFF00": { "MARD": "A03", "COCO": "E05", "漫漫": "B2", "盼盼": "28", "咪小窝": "28" },
            "#FF00FF": { "MARD": "D01", "COCO": "J01", "漫漫": "A1", "盼盼": "14", "咪小窝": "14" },
            "#00FFFF": { "MARD": "C01", "COCO": "I01", "漫漫": "D1", "盼盼": "52", "咪小窝": "52" },
            "#FFA500": { "MARD": "A07", "COCO": "D08", "漫漫": "B6", "盼盼": "4", "咪小窝": "4" },
            "#FFC0CB": { "MARD": "D08", "COCO": "J08", "漫漫": "A8", "盼盼": "31", "咪小窝": "31" },
            "#808080": { "MARD": "H7", "COCO": "H07", "漫漫": "H7", "盼盼": "46", "咪小窝": "46" },
            "#8B4513": { "MARD": "E01", "COCO": "K01", "漫漫": "F1", "盼盼": "61", "咪小窝": "66" },
            "#FFD700": { "MARD": "A04", "COCO": "E07", "漫漫": "B3", "盼盼": "3", "咪小窝": "3" },
            "#4169E1": { "MARD": "C06", "COCO": "I06", "漫漫": "D6", "盼盼": "63", "咪小窝": "68" },
            "#32CD32": { "MARD": "B04", "COCO": "F09", "漫漫": "C3", "盼盼": "66", "咪小窝": "78" },
            "#FF69B4": { "MARD": "D03", "COCO": "J03", "漫漫": "A3", "盼盼": "13", "咪小窝": "13" },
            "#87CEEB": { "MARD": "C02", "COCO": "I02", "漫漫": "D2", "盼盼": "58", "咪小窝": "58" },
            "#FFE4C4": { "MARD": "A23", "COCO": "E12", "漫漫": "R08", "盼盼": "274", "咪小窝": "259" },
            "#DDA0DD": { "MARD": "D10", "COCO": "J10", "漫漫": "A10", "盼盼": "78", "咪小窝": "83" },
            "#98FB98": { "MARD": "B03", "COCO": "F04", "漫漫": "C7", "盼盼": "26", "咪小窝": "26" }
        };

        // ==================== 工具函数 ====================

        // HEX 转 RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // RGB 转 color-diff 格式
        function toColorDiffFormat(rgb) {
            return { R: rgb.r, G: rgb.g, B: rgb.b };
        }

        // 获取色板
        function getPalette() {
            return Object.keys(COLOR_PALETTE).map(hex => {
                const rgb = hexToRgb(hex);
                return { hex, rgb };
            });
        }

        // 获取显示用的色号
        function getDisplayKey(hex) {
            const mapping = COLOR_PALETTE[hex.toUpperCase()];
            if (!mapping) return '?';
            return mapping[state.colorSystem] || '?';
        }

        // ==================== 步骤1: 图片上传 ====================

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const originalPreview = document.getElementById('originalPreview');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) loadImage(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    state.originalImage = img;
                    originalPreview.src = e.target.result;
                    document.getElementById('imageSize').textContent =
                        `${img.width} × ${img.height} 像素`;
                    previewContainer.classList.add('active');
                    document.getElementById('convertBtn').disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==================== 步骤2: 参数控制 ====================

        // 粒度滑块
        document.getElementById('granularity').addEventListener('input', (e) => {
            document.getElementById('granularityValue').textContent = e.target.value;
        });

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.pixelationMode = btn.dataset.mode;
            });
        });

        // 色号体系切换
        document.getElementById('colorSystem').addEventListener('change', (e) => {
            state.colorSystem = e.target.value;
            // 如果已经有结果，重新渲染色号显示
            if (state.colorCounts) {
                renderColorStats();
            }
        });

        // ==================== 核心算法: 图像转拼豆 ====================

        // 计算单元格代表色
        function getCellColor(imageData, startX, startY, width, height, mode) {
            const data = imageData.data;
            const imgWidth = imageData.width;

            if (mode === 'average') {
                // 平均色模式
                let r = 0, g = 0, b = 0, count = 0;

                for (let y = startY; y < startY + height; y++) {
                    for (let x = startX; x < startX + width; x++) {
                        const i = (y * imgWidth + x) * 4;
                        if (data[i + 3] < 128) continue; // 跳过透明像素

                        r += data[i];
                        g += data[i + 1];
                        b += data[i + 2];
                        count++;
                    }
                }

                if (count === 0) return null;
                return {
                    r: Math.round(r / count),
                    g: Math.round(g / count),
                    b: Math.round(b / count)
                };

            } else {
                // 主导色模式
                const colorCounts = {};
                let maxCount = 0;
                let dominantColor = null;

                for (let y = startY; y < startY + height; y++) {
                    for (let x = startX; x < startX + width; x++) {
                        const i = (y * imgWidth + x) * 4;
                        if (data[i + 3] < 128) continue;

                        const key = `${data[i]},${data[i+1]},${data[i+2]}`;
                        colorCounts[key] = (colorCounts[key] || 0) + 1;

                        if (colorCounts[key] > maxCount) {
                            maxCount = colorCounts[key];
                            dominantColor = {
                                r: data[i],
                                g: data[i + 1],
                                b: data[i + 2]
                            };
                        }
                    }
                }

                return dominantColor;
            }
        }

        // 使用 color-diff 查找最接近的颜色
        function findClosestColor(targetRgb, palette) {
            const target = toColorDiffFormat(targetRgb);

            const paletteColors = palette.map(p => ({
                R: p.rgb.r,
                G: p.rgb.g,
                B: p.rgb.b,
                hex: p.hex
            }));

            const closest = colorDiff.closest(target, paletteColors);
            return closest.hex;
        }

        // 转换图片为拼豆网格
        function convertToBeadGrid() {
            if (!state.originalImage) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const img = state.originalImage;
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const granularity = parseInt(document.getElementById('granularity').value);
            const N = granularity;
            const M = Math.round((img.height / img.width) * N);

            const cellWidth = img.width / N;
            const cellHeight = img.height / M;

            const imageData = ctx.getImageData(0, 0, img.width, img.height);
            const palette = getPalette();
            const grid = [];

            for (let j = 0; j < M; j++) {
                const row = [];
                for (let i = 0; i < N; i++) {
                    const startX = Math.floor(i * cellWidth);
                    const startY = Math.floor(j * cellHeight);
                    const w = Math.floor((i + 1) * cellWidth) - startX;
                    const h = Math.floor((j + 1) * cellHeight) - startY;

                    const cellRgb = getCellColor(
                        imageData,
                        startX, startY, w, h,
                        state.pixelationMode
                    );

                    if (cellRgb) {
                        const hex = findClosestColor(cellRgb, palette);
                        row.push(hex);
                    } else {
                        row.push('#FFFFFF'); // 透明区域用白色
                    }
                }
                grid.push(row);
            }

            return { grid, N, M };
        }

        // ==================== 转换按钮 ====================

        document.getElementById('convertBtn').addEventListener('click', () => {
            document.getElementById('loading').classList.add('active');
            document.getElementById('noResult').style.display = 'none';
            document.getElementById('noStats').style.display = 'none';

            setTimeout(() => {
                try {
                    const result = convertToBeadGrid();
                    state.gridData = result;

                    // 渲染预览
                    renderBeadPreview(result);

                    // 统计颜色
                    calculateColorStats(result);

                    // 启用导出按钮
                    document.getElementById('exportImageBtn').disabled = false;
                    document.getElementById('exportStatsBtn').disabled = false;

                } catch (error) {
                    console.error('转换失败:', error);
                    alert('转换失败，请重试');
                } finally {
                    document.getElementById('loading').classList.remove('active');
                }
            }, 100);
        });

        // ==================== 步骤3: 渲染预览 ====================

        function renderBeadPreview(result) {
            const canvas = document.getElementById('beadPreview');
            const ctx = canvas.getContext('2d');
            const { grid, N, M } = result;

            const cellSize = Math.min(600 / N, 600 / M);
            canvas.width = N * cellSize;
            canvas.height = M * cellSize;

            for (let j = 0; j < M; j++) {
                for (let i = 0; i < N; i++) {
                    const x = i * cellSize;
                    const y = j * cellSize;

                    ctx.fillStyle = grid[j][i];
                    ctx.fillRect(x, y, cellSize, cellSize);

                    ctx.strokeStyle = '#ddd';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, cellSize, cellSize);
                }
            }

            document.getElementById('resultContainer').classList.add('active');
            document.getElementById('gridSize').textContent = `${N} × ${M}`;
        }

        // ==================== 步骤4: 色系统计 ====================

        function calculateColorStats(result) {
            const { grid } = result;
            const counts = {};
            let total = 0;

            grid.forEach(row => {
                row.forEach(hex => {
                    counts[hex] = (counts[hex] || 0) + 1;
                    total++;
                });
            });

            state.colorCounts = counts;
            document.getElementById('beadCount').textContent = `${total} 颗`;

            renderColorStats();
        }

        function renderColorStats() {
            const container = document.getElementById('colorStats');
            const counts = state.colorCounts;

            const sortedColors = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            let html = '<div class="color-stats">';
            sortedColors.forEach(hex => {
                const key = getDisplayKey(hex);
                const count = counts[hex];

                html += `
                    <div class="color-item">
                        <div class="color-swatch" style="background: ${hex}"></div>
                        <div class="color-info">
                            <div class="color-key">${key}</div>
                            <div class="color-count">${count} 颗</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            container.innerHTML = html;
        }

        // ==================== 步骤5: 导出 ====================

        // 导出拼豆图
        document.getElementById('exportImageBtn').addEventListener('click', () => {
            const { grid, N, M } = state.gridData;
            const cellSize = 30;

            const canvas = document.createElement('canvas');
            canvas.width = N * cellSize;
            canvas.height = M * cellSize;
            const ctx = canvas.getContext('2d');

            const fontSize = Math.max(8, cellSize * 0.35);
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let j = 0; j < M; j++) {
                for (let i = 0; i < N; i++) {
                    const x = i * cellSize;
                    const y = j * cellSize;
                    const hex = grid[j][i];

                    // 填充颜色
                    ctx.fillStyle = hex;
                    ctx.fillRect(x, y, cellSize, cellSize);

                    // 绘制色号
                    const key = getDisplayKey(hex);
                    const brightness = (
                        hexToRgb(hex).r * 0.299 +
                        hexToRgb(hex).g * 0.587 +
                        hexToRgb(hex).b * 0.114
                    );
                    ctx.fillStyle = brightness > 128 ? '#000' : '#fff';
                    ctx.fillText(key, x + cellSize/2, y + cellSize/2);

                    // 边框
                    ctx.strokeStyle = '#ddd';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, cellSize, cellSize);
                }
            }

            // 下载
            const link = document.createElement('a');
            link.download = `bead-pattern-${N}x${M}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // 导出色系统计
        document.getElementById('exportStatsBtn').addEventListener('click', () => {
            const counts = state.colorCounts;
            const sortedColors = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            const canvas = document.createElement('canvas');
            const width = 600;
            const padding = 30;
            const lineHeight = 40;
            const height = padding * 2 + 60 + sortedColors.length * lineHeight + 60;

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);

            // 标题
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('拼豆色系统计', padding, padding + 30);

            // 分隔线
            ctx.strokeStyle = '#ddd';
            ctx.beginPath();
            ctx.moveTo(padding, padding + 50);
            ctx.lineTo(width - padding, padding + 50);
            ctx.stroke();

            // 颜色列表
            ctx.font = '16px sans-serif';
            let y = padding + 80;

            sortedColors.forEach(hex => {
                const key = getDisplayKey(hex);
                const count = counts[hex];

                // 色块
                ctx.fillStyle = hex;
                ctx.fillRect(padding, y - 15, 25, 25);
                ctx.strokeStyle = '#ccc';
                ctx.strokeRect(padding, y - 15, 25, 25);

                // 色号
                ctx.fillStyle = '#333';
                ctx.textAlign = 'left';
                ctx.fillText(key, padding + 35, y);

                // 数量
                ctx.textAlign = 'right';
                ctx.fillText(`${count} 颗`, width - padding, y);

                y += lineHeight;
            });

            // 总计
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            ctx.strokeStyle = '#ddd';
            ctx.beginPath();
            ctx.moveTo(padding, y + 10);
            ctx.lineTo(width - padding, y + 10);
            ctx.stroke();

            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`总计: ${total} 颗`, width - padding, y + 40);

            // 下载
            const link = document.createElement('a');
            link.download = `bead-colors-stats.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
